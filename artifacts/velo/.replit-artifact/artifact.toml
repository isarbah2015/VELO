kind = "mobile"
previewPath = "/"
title = "VELO — Ride Hailing"
version = "1.0.0"
id = "artifacts/velo"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22549

[services.development]
run = "pnpm --filter @workspace/velo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/velo", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/velo", "run", "serve" ]

[services.env]
PORT = "22549"
BASE_PATH = "/"
